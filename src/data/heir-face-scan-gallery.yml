schema_version: 1
gallery_id: heir-face-scan
title: HEIR Health Scan Gallery
intro: I drew on wearable app patterns and Shen.ai reference screens, then adapted them around research on trust,
  consistency, and clear explanations. This gallery brings those references together with the complete HEIR screen
  collection.
source_document: Gallery/Face scan/face-scan-gallery-document.docx
source_zip: Gallery(1).zip
notes:
- The 28 stories are ordered as in the supplied Word document; references and finished designs are always separate
  collections.
- References are static framed images, never carousel slides; HEIR screens form a responsive, continuous horizontal
  scroller.
- Use the source_path to locate original high-resolution PNGs; do not extract reduced Word thumbnails.
- Alt text describes the image independently of its visible caption. Visible captions stay attached to the corresponding
  image.
- 'Assets marked included_in_document: false are unused moodboard references; do not publish them unless the user
  approves.'
- External references must retain their visible Reference and source-credit labels; do not imply HEIR ownership of
  these reference designs.
chapters:
- id: onboarding-and-permissions
  title: Onboarding and permissions
  stories:
  - id: introducing-the-scan
    title: Introducing the scan
    explanation: Research highlighted the need for trust and clear explanations. I separated the introduction, technology
      explanation, and consent so people could understand the scan before granting access.
    references: []
    screens:
    - asset_id: onboarding-glance-1-png
      caption: Health at a glance
    - asset_id: onboarding-tech-2-png
      caption: Explain the technology
    - asset_id: onboarding-data-privacy-3-png
      caption: Data privacy and consent
  - id: turning-guidance-into-preparation
    title: Turning guidance into preparation
    explanation: I used the preparation requirements in the Shen.ai references as a starting point, then turned their
      dense guidance into four steps. Rest, lighting, framing, and stillness become actions people can take before
      starting.
    references:
    - asset_id: reference-image-11-png
      caption: Technology and preparation
    - asset_id: reference-image-12-png
      caption: Capture instructions
    screens:
    - asset_id: onboarding-prepare-scan-4-png
      caption: Prepare for the scan
  - id: camera-access-and-recovery
    title: Camera access and recovery
    explanation: I kept camera prompts familiar and made each blocked state actionable. People can allow access, open
      device settings, or retry when another app is using the camera.
    references: []
    screens:
    - asset_id: onboarding-camera-access-5-png
      caption: Allow camera access
    - asset_id: onboarding-camera-settings-6-png
      caption: Open camera settings
    - asset_id: onboarding-camera-unavailable-7-png
      caption: Camera unavailable
- id: scan-experience
  title: Scan experience
  stories:
  - id: starting-the-scan
    title: Starting the scan
    explanation: The live workout reference shows how a camera or activity view can keep a reading and a primary control
      prominent. I adapted that hierarchy around face positioning, scan duration, and a clear start action.
    references:
    - asset_id: reference-frame-4-4-png
      caption: Live workout display
    screens:
    - asset_id: capture-normal-scan-start-info-1-1-png
      caption: Ready to scan
    - asset_id: capture-normal-scan-starting-2-png
      caption: Starting capture
  - id: progress-and-completion
    title: Progress and completion
    explanation: I kept progress in the same position as capture began, advanced, and finished. A separate processing
      message makes clear that capturing the scan and receiving its results are different states.
    references: []
    screens:
    - asset_id: capture-normal-scan-progress-info-2-3-png
      caption: Scan in progress
    - asset_id: capture-normal-scan-complete-4-png
      caption: Capture complete
  - id: lighting-feedback
    title: Lighting feedback
    explanation: The preparation guidance carries into the live view as a specific correction. The banner tells people
      whether to find more light, remove backlighting, or make illumination more even.
    references: []
    screens:
    - asset_id: capture-warning-scan-well-lit-1-png
      caption: Find a well lit area
    - asset_id: capture-warning-scan-bright-light-2-png
      caption: Remove backlighting
    - asset_id: capture-warning-scan-even-light-3-png
      caption: Find even light
  - id: staying-still
    title: Staying still
    explanation: I paired each warning with an action people can perform immediately. Face movement, device movement,
      and talking receive different instructions while the scan remains visible.
    references: []
    screens:
    - asset_id: capture-warning-scan-hold-still-4-png
      caption: Hold completely still
    - asset_id: capture-warning-scan-hold-steady-5-png
      caption: Hold the device steady
    - asset_id: capture-warning-scan-relax-face-6-png
      caption: Relax and avoid talking
  - id: correcting-position
    title: Correcting position
    explanation: The frame changes with the detected position, while the message names the correction. Matching left
      and right states keeps the same behavior understandable in either direction.
    references: []
    screens:
    - asset_id: capture-warning-scan-center-face-8-png
      caption: Center face from the left
    - asset_id: capture-warning-scan-center-face-9-png
      caption: Center face from the right
  - id: correcting-distance
    title: Correcting distance
    explanation: I combined framing feedback with direct distance instructions. Moving closer or farther away uses
      the same paused state and recovery path.
    references: []
    screens:
    - asset_id: capture-warning-scan-move-close-10-png
      caption: Move closer
    - asset_id: capture-warning-scan-move-back-11-png
      caption: Move farther away
  - id: keeping-the-face-visible
    title: Keeping the face visible
    explanation: I distinguished a covered forehead from an obscured face so the instruction matches the obstruction.
      Both warnings remain inside the capture view, where people can check the correction.
    references: []
    screens:
    - asset_id: capture-warning-scan-uncover-7-png
      caption: Uncover the forehead
    - asset_id: capture-warning-scan-face-visible-12-png
      caption: Keep the full face visible
  - id: keeping-one-face-in-view
    title: Keeping one face in view
    explanation: Missing and multiple faces need different corrections. I made those states explicit rather than leaving
      people to interpret an empty or ambiguous frame.
    references: []
    screens:
    - asset_id: capture-warning-scan-face-view-13-png
      caption: Bring face into view
    - asset_id: capture-warning-scan-one-face-14-png
      caption: Keep one face in view
  - id: failed-and-timed-out-scans
    title: Failed and timed out scans
    explanation: Research made consistency central to trust, so failure needed a visible explanation and a predictable
      retry. Failed capture and timeout share the same restart control.
    references: []
    screens:
    - asset_id: capture-failure-scan-fail-1-png
      caption: Scan failed
    - asset_id: capture-failure-scan-time-out-2-png
      caption: Scan timed out
- id: scan-and-scan-history
  title: Scan and scan history
  stories:
  - id: making-the-snapshot-legible
    title: Making the snapshot legible
    explanation: I combined the moodboard’s status gauge and grouped measurement cards into one health overview. A
      scan-quality label and brief summary address the research need for interpretation before individual readings.
    references:
    - asset_id: reference-frame-4-4-png
      caption: Live workout display
    - asset_id: reference-frame-3-3-png
      caption: Wearable wellbeing cards
    screens:
    - asset_id: history-health-main-3-png
      caption: Health overview
  - id: guest-results-and-saved-history
    title: Guest results and saved history
    explanation: I separated a guest snapshot from the personal history needed for repeated comparisons. Saved scans
      use dated status summaries, with editing and deletion available from the result.
    references: []
    screens:
    - asset_id: history-guest-result-2-png
      caption: Guest snapshot
    - asset_id: history-scan-history-1-png
      caption: Scan history
    - asset_id: history-scan-result-action-png
      caption: Result actions
- id: scan-details
  title: Scan details
  stories:
  - id: giving-each-reading-a-clear-home
    title: Giving each reading a clear home
    explanation: Shen.ai’s cards establish a simple value-and-unit hierarchy. I carried that into individual detail
      sheets, adding status labels and plain-language explanations of what each estimate represents.
    references:
    - asset_id: reference-image-13-png
      caption: Vital sign cards
    screens:
    - asset_id: details-pulse-sheet-2-png
      caption: Pulse
    - asset_id: details-cardiac-effort-sheet-3-png
      caption: Cardiac effort
  - id: explaining-labels-and-personal-baselines
    title: Explaining labels and personal baselines
    explanation: The sleep reference pairs ranges with understandable labels, a pattern I adapted for interpreting
      health readings. For variability, I also exposed the baseline-building state so a personal comparison does not
      appear ready before it is established.
    references:
    - asset_id: reference-frame-1-1-png
      caption: Sleep ranges
    screens:
    - asset_id: details-hrv-sheet-1-png
      caption: Variability baseline
    - asset_id: details-stress-level-sheet-4-png
      caption: Stress level
  - id: leaving-room-for-trends
    title: Leaving room for trends
    explanation: The AVI reference combines a reading, its range, and a trend chart with explanatory text. I adapted
      that detail hierarchy for blood pressure and breathing, reserving a clearly marked Coming soon area for future
      trends.
    references:
    - asset_id: reference-image-26-png
      caption: Ranges and trends
    screens:
    - asset_id: details-bp-sheet-5-png
      caption: Blood pressure estimate
    - asset_id: details-br-sheet-below-65-9-png
      caption: Breathing rhythm
  - id: explaining-bp-outlook-and-its-limits
    title: Explaining BP Outlook and its limits
    explanation: Blood pressure was both desired and questioned in research, so I separated the estimate from its
      meaning and required inputs. Setup needed and unavailable states explain why a result cannot be shown.
    references: []
    screens:
    - asset_id: details-bp-outlook-sheet-6-png
      caption: BP Outlook estimate
    - asset_id: details-bp-outlook-setup-needed-7-png
      caption: BP Outlook setup needed
    - asset_id: details-bp-outlook-unavailable-8-png
      caption: BP Outlook unavailable
  - id: connecting-estimates-to-profile-information
    title: Connecting estimates to profile information
    explanation: Wearable profile references make age and body details part of the health experience. I connected
      those inputs to the vascular-age sheet and made missing information visible before presenting an estimate.
    references:
    - asset_id: reference-frame-7-6-png
      caption: Wearable profile fields
    screens:
    - asset_id: details-va-sheet-10-png
      caption: Vascular age
    - asset_id: details-va-sheet-setup-needed-11-png
      caption: Vascular age setup needed
  - id: separating-weight-from-its-estimated-label
    title: Separating weight from its estimated label
    explanation: The Shen.ai reference links body measurements to calculated indices. I made the weight sheet explicit
      about whether its BMI label uses profile information or remains estimated because height is missing.
    references:
    - asset_id: reference-image-15-png
      caption: Body mass and actions
    screens:
    - asset_id: details-weight-sheet-12-png
      caption: Weight with profile height
    - asset_id: details-weight-estimated-with-weight-13-png
      caption: Estimated BMI label
  - id: body-composition-and-setup-requirements
    title: Body composition and setup requirements
    explanation: I adapted the reference’s body-composition cards into a sheet that explains the estimate and its
      labels. A separate setup state identifies the profile details needed before showing a result.
    references:
    - asset_id: reference-image-16-png
      caption: Body composition
    screens:
    - asset_id: details-body-fat-sheet-14-png
      caption: Body fat percentage
    - asset_id: details-body-fat-sheet-setup-needed-15-png
      caption: Body fat setup needed
- id: scan-routine
  title: Scan routine
  stories:
  - id: choosing-a-check-in-routine
    title: Choosing a check in routine
    explanation: The task-scheduling reference groups frequency, timing, and notification choices in one place. I
      adapted that familiar structure to an active health check-in, pairing scan length with routines that fit different
      schedules.
    references:
    - asset_id: reference-frame-6-5-png
      caption: Task scheduling
    screens:
    - asset_id: routine-routine-question-60-selected-1-png
      caption: 60-second scan
    - asset_id: routine-routine-question-30-selected-2-png
      caption: 30-second scan
  - id: explaining-the-choices
    title: Explaining the choices
    explanation: Research showed uncertainty about fitting an active scan into a wearable routine. I placed the scan-length
      explanation beside the choice and used expandable descriptions to explain what each routine is for.
    references: []
    screens:
    - asset_id: routine-scan-length-info-3-png
      caption: Explain scan length
    - asset_id: routine-routine-once-daily-4-png
      caption: Expanded routine guidance
  - id: daily-timing-and-reminders
    title: Daily timing and reminders
    explanation: I turned the scheduling pattern into a daily time window with a specific reminder. Separate phone
      and HEIR controls let people choose where that reminder arrives.
    references: []
    screens:
    - asset_id: routine-once-daily-routine-5-png
      caption: Daily morning window
    - asset_id: routine-once-daily-set-reminder-6-png
      caption: Choose reminder time
  - id: routines-for-different-schedules
    title: Routines for different schedules
    explanation: I extended the same time-window and reminder controls to twice-daily, alternate-day, and twice-weekly
      check-ins. Keeping the visual pattern consistent makes the schedule change easier to understand.
    references: []
    screens:
    - asset_id: routine-twice-daily-routine-7-png
      caption: Morning and evening
    - asset_id: routine-alt-days-routine-9-png
      caption: Alternate days
    - asset_id: routine-twice-weekly-routine-10-png
      caption: Choose two weekdays
  - id: validating-the-schedule
    title: Validating the schedule
    explanation: I added validation to the reference scheduling pattern so the twice-daily routine requires two time
      windows. The instruction sits beside the selection, and completion remains disabled until the choice is valid.
    references:
    - asset_id: reference-frame-6-5-png
      caption: Task scheduling
    screens:
    - asset_id: routine-twice-daily-error-8-png
      caption: Two windows required
- id: user-profile
  title: User profile
  stories:
  - id: organizing-account-controls
    title: Organizing account controls
    explanation: The settings reference uses familiar grouped rows and direct navigation. I adapted that structure
      to keep personal details, scan preferences, security, and support in a consistent profile area.
    references:
    - asset_id: reference-frame-11-9-png
      caption: Bevel settings
    screens:
    - asset_id: profile-profile-1-png
      caption: Profile navigation
    - asset_id: profile-signin-security-3-png
      caption: Sign in and security
  - id: explaining-why-personal-details-matter
    title: Explaining why personal details matter
    explanation: Oura’s profile explanation shows how to give personal questions a purpose. I used that approach to
      connect body details and health history with the estimates they support, including choices for uncertain or
      undisclosed answers.
    references:
    - asset_id: reference-frame-8-7-png
      caption: Oura profile explanation
    screens:
    - asset_id: profile-personal-details-filled-2-png
      caption: Personal details
    - asset_id: profile-update-health-history-4-png
      caption: Health history
