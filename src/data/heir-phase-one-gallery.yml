schema_version: 1
gallery_id: heir-phase-one
title: HEIR Phase One Gallery
eyebrow: GANANCE / HEIR PHASE ONE
intro: This first redesign organized the original app around Home, Insights, Settings, and Account for
  the public launch. I adapted familiar wearable patterns to HEIR’s screenless device, from setup and
  daily activity to controls and connection recovery.
source_document: Gallery/Phase one/heir-phase-one-product-gallery.docx
source_archive: Gallery/Phase one.zip
notes:
  - Only the 59 explicitly listed HEIR designs may be imported during implementation.
  - The Word document and original PNGs remain outside the published website.
  - Moodboard images and all unselected PNGs are excluded.
  - The onboarding apostrophe filename is resolved to the existing Unicode filename; no source asset is
    renamed.
  - Explanations retain authored inline Markdown emphasis.
publication_rules:
  include_only_screens_listed_in_this_manifest: true
  exclude_reference_images: true
  exclude_source_directory: Phase one/Moodboard/
  reuse_existing_gallery_components: true
  do_not_publish_source_documents_or_unselected_images: true
  preserve_screen_and_story_order: true
chapters:
  - id: onboarding
    title: Onboarding
    order: 1
    stories:
      - id: introducing-the-product
        title: Introducing the product
        order: 1
        source_document_page: 1
        explanation: I used lifestyle imagery to show how HEIR fits beneath a traditional watch, then introduced
          its capabilities before account setup. A consistent primary action carries the introduction
          into the app.
        screens:
          - asset_id: introducing-the-product--lifestyle-introduction
            order: 1
            caption: Lifestyle introduction
          - asset_id: introducing-the-product--getting-started
            order: 2
            caption: Getting started
          - asset_id: introducing-the-product--product-capabilities
            order: 3
            caption: Product capabilities
      - id: creating-an-account-and-personalizing-setup
        title: Creating an account and personalizing setup
        order: 2
        source_document_page: 2
        explanation: I broke account creation into short steps and explained why personal details were requested.
          The optional profile step gives people a way to continue without completing every field.
        screens:
          - asset_id: creating-an-account-and-personalizing-setup--create-an-account
            order: 1
            caption: Create an account
          - asset_id: creating-an-account-and-personalizing-setup--account-details
            order: 2
            caption: Account details
          - asset_id: creating-an-account-and-personalizing-setup--personalize-setup
            order: 3
            caption: Personalize setup
  - id: pairing-and-connection
    title: Pairing and connection
    order: 2
    stories:
      - id: preparing-the-device-and-permissions
        title: Preparing the device and permissions
        order: 1
        source_document_page: 3
        explanation: I paired physical setup instructions with contextual permission requests. The alert
          preferences explain what HEIR will notify people about before the system asks for access.
        screens:
          - asset_id: preparing-the-device-and-permissions--wear-the-device
            order: 1
            caption: Wear the device
          - asset_id: preparing-the-device-and-permissions--bluetooth-permission
            order: 2
            caption: Bluetooth permission
          - asset_id: preparing-the-device-and-permissions--alert-preferences
            order: 3
            caption: Alert preferences
      - id: finding-and-connecting-heir
        title: Finding and connecting HEIR
        order: 2
        source_document_page: 4
        explanation: The pairing flow combines a physical gesture with visible search feedback and a selectable
          device list. A separate confirmation marks the transition from setup to a connected device.
        screens:
          - asset_id: finding-and-connecting-heir--searching-for-heir
            order: 1
            caption: Searching for HEIR
          - asset_id: finding-and-connecting-heir--available-devices
            order: 2
            caption: Available devices
          - asset_id: finding-and-connecting-heir--connection-complete
            order: 3
            caption: Connection complete
      - id: recovering-from-connection-problems
        title: Recovering from connection problems
        order: 3
        source_document_page: 5
        explanation: I kept retry guidance beside the activation instruction and distinguished a paired device
          from one that is currently detected. These states make the connection problem visible without
          restarting the whole setup.
        screens:
          - asset_id: recovering-from-connection-problems--retry-connection
            order: 1
            caption: Retry connection
          - asset_id: recovering-from-connection-problems--paired-but-not-detected
            order: 2
            caption: Paired but not detected
      - id: learning-the-app-in-place
        title: Learning the app in place
        order: 4
        source_document_page: 6
        explanation: I used an optional walkthrough to point directly to device management, customization, and
          the daily breakdown. Highlighting each control in context connects the explanation to the
          action people will use.
        screens:
          - asset_id: learning-the-app-in-place--find-device-controls
            order: 1
            caption: Find device controls
          - asset_id: learning-the-app-in-place--find-customization
            order: 2
            caption: Find customization
          - asset_id: learning-the-app-in-place--explore-daily-movement
            order: 3
            caption: Explore daily movement
  - id: home-and-insights
    title: Home and insights
    order: 3
    stories:
      - id: reading-the-day-at-a-glance
        title: Reading the day at a glance
        order: 1
        source_document_page: 7
        explanation: I drew on Cole Nussbaumer Knaflic’s *Storytelling with Data* to focus attention on daily
          progress. A prominent total, secondary metrics, and a time-of-day breakdown give the activity
          views a clear reading order.
        screens:
          - asset_id: reading-the-day-at-a-glance--home-overview
            order: 1
            caption: Home overview
          - asset_id: reading-the-day-at-a-glance--goal-achieved
            order: 2
            caption: Goal achieved
          - asset_id: reading-the-day-at-a-glance--daily-breakdown
            order: 3
            caption: Daily breakdown
      - id: exploring-steps-over-time
        title: Exploring steps over time
        order: 2
        source_document_page: 8
        explanation: I kept gridlines subdued and placed the selected value beside its bar, applying the book’s
          emphasis on reducing clutter and directing attention. Familiar time filters connect the daily
          view to the weekly summary.
        screens:
          - asset_id: exploring-steps-over-time--daily-steps
            order: 1
            caption: Daily steps
          - asset_id: exploring-steps-over-time--weekly-chart-selection
            order: 2
            caption: Weekly chart selection
      - id: keeping-activity-views-consistent
        title: Keeping activity views consistent
        order: 3
        source_document_page: 9
        explanation: "I matched the chart to the question: a cumulative curve shows activity building through the
          day, while bars compare days within a week. The same filters and summary hierarchy carry across
          steps and calories."
        screens:
          - asset_id: keeping-activity-views-consistent--daily-calories
            order: 1
            caption: Daily calories
          - asset_id: keeping-activity-views-consistent--weekly-calories
            order: 2
            caption: Weekly calories
  - id: settings-and-controls
    title: Settings and controls
    order: 4
    stories:
      - id: giving-customization-a-clear-home
        title: Giving customization a clear home
        order: 1
        source_document_page: 10
        explanation: Card sorting and tree testing informed one Settings destination with recognizable groups for
          controls, alerts, and integrations. I used grouped rows to lead into focused screens for tap
          behavior and vibration intensity.
        screens:
          - asset_id: giving-customization-a-clear-home--settings-groups
            order: 1
            caption: Settings groups
          - asset_id: giving-customization-a-clear-home--tap-controls
            order: 2
            caption: Tap controls
          - asset_id: giving-customization-a-clear-home--vibration-intensity
            order: 3
            caption: Vibration intensity
      - id: adjusting-tap-behavior
        title: Adjusting tap behavior
        order: 2
        source_document_page: 11
        explanation: I kept sensitivity choices in focused dialogs with explicit confirmation. Turning off the
          triple-tap action changes the available controls while retaining the settings for tap force and
          speed.
        screens:
          - asset_id: adjusting-tap-behavior--tap-force
            order: 1
            caption: Tap force
          - asset_id: adjusting-tap-behavior--tap-speed
            order: 2
            caption: Tap speed
          - asset_id: adjusting-tap-behavior--triple-tap-disabled
            order: 3
            caption: Triple tap disabled
      - id: choosing-alerts-and-understanding-feedback
        title: Choosing alerts and understanding feedback
        order: 3
        source_document_page: 12
        explanation: Separate toggles let people choose message and call alerts. An information sheet explains
          the vibration patterns and connection requirements without filling the main controls screen
          with instructions.
        screens:
          - asset_id: choosing-alerts-and-understanding-feedback--message-and-call-alerts
            order: 1
            caption: Message and call alerts
          - asset_id: choosing-alerts-and-understanding-feedback--alert-guidance
            order: 2
            caption: Alert guidance
      - id: mapping-gestures-to-media-and-calls
        title: Mapping gestures to media and calls
        order: 4
        source_document_page: 13
        explanation: I placed gesture mappings beside the functions they control, using the same compact guide
          for media and incoming calls. The call screen also makes its always-active behavior explicit.
        screens:
          - asset_id: mapping-gestures-to-media-and-calls--media-gestures
            order: 1
            caption: Media gestures
          - asset_id: mapping-gestures-to-media-and-calls--call-gestures
            order: 2
            caption: Call gestures
      - id: connecting-activity-data
        title: Connecting activity data
        order: 5
        source_document_page: 14
        explanation: I gave health syncing a focused control and a short explanation of what is shared. The same
          information-sheet pattern provides detail when needed while leaving the main choice easy to
          scan.
        screens:
          - asset_id: connecting-activity-data--health-syncing
            order: 1
            caption: Health syncing
          - asset_id: connecting-activity-data--sync-explanation
            order: 2
            caption: Sync explanation
  - id: device-management
    title: Device management
    order: 5
    stories:
      - id: checking-status-and-reconnecting
        title: Checking status and reconnecting
        order: 1
        source_document_page: 15
        explanation: Wearable device references informed the product image, battery readout, and connection
          actions in one place. A low-battery treatment and a disconnected state preserve that hierarchy
          while changing the feedback and next action.
        screens:
          - asset_id: checking-status-and-reconnecting--connected-device
            order: 1
            caption: Connected device
          - asset_id: checking-status-and-reconnecting--low-battery
            order: 2
            caption: Low battery
          - asset_id: checking-status-and-reconnecting--disconnected-device
            order: 3
            caption: Disconnected device
      - id: finding-help-beside-device-information
        title: Finding help beside device information
        order: 2
        source_document_page: 16
        explanation: I grouped device details with expandable FAQs and a route to connection troubleshooting.
          Illustrated recovery steps and a question form offer more help without interrupting the main
          device view.
        screens:
          - asset_id: finding-help-beside-device-information--device-information
            order: 1
            caption: Device information
          - asset_id: finding-help-beside-device-information--connection-troubleshooting
            order: 2
            caption: Connection troubleshooting
          - asset_id: finding-help-beside-device-information--ask-a-question
            order: 3
            caption: Ask a question
      - id: explaining-disconnect-and-reset-actions
        title: Explaining disconnect and reset actions
        order: 3
        source_document_page: 17
        explanation: I separated forgetting the device from resetting its connection and placed guidance before
          the reset action. Confirmation dialogs explain the consequence and provide a way to cancel.
        screens:
          - asset_id: explaining-disconnect-and-reset-actions--disconnect-confirmation
            order: 1
            caption: Disconnect confirmation
          - asset_id: explaining-disconnect-and-reset-actions--reset-guidance
            order: 2
            caption: Reset guidance
          - asset_id: explaining-disconnect-and-reset-actions--reset-confirmation
            order: 3
            caption: Reset confirmation
      - id: making-an-update-actionable
        title: Making an update actionable
        order: 4
        source_document_page: 18
        explanation: Connected-device references informed a clear update prompt with release notes and
          preparation requirements. A notice on Home gives the update a visible entry point in the
          everyday experience.
        screens:
          - asset_id: making-an-update-actionable--update-notice-on-home
            order: 1
            caption: Update notice on Home
          - asset_id: making-an-update-actionable--update-requirements
            order: 2
            caption: Update requirements
      - id: showing-update-progress-and-completion
        title: Showing update progress and completion
        order: 5
        source_document_page: 19
        explanation: I carried the circular status treatment from the update prompt into percentage progress and
          a completion check. The progress screen explains what to do while the update runs, and the
          final screen provides a clear exit.
        screens:
          - asset_id: showing-update-progress-and-completion--update-in-progress
            order: 1
            caption: Update in progress
          - asset_id: showing-update-progress-and-completion--update-complete
            order: 2
            caption: Update complete
  - id: account-and-profile
    title: Account and profile
    order: 6
    stories:
      - id: separating-account-management-from-device-controls
        title: Separating account management from device controls
        order: 1
        source_document_page: 20
        explanation: Research placed account functions in a distinct destination. I grouped profile, goals, and
          support here, then used confirmation dialogs to distinguish signing out from permanently
          deleting the account.
        screens:
          - asset_id: separating-account-management-from-device-controls--account-navigation
            order: 1
            caption: Account navigation
          - asset_id: separating-account-management-from-device-controls--sign-out-confirmation
            order: 2
            caption: Sign out confirmation
          - asset_id: separating-account-management-from-device-controls--delete-account-confirmation
            order: 3
            caption: Delete account confirmation
      - id: editing-details-with-local-feedback
        title: Editing details with local feedback
        order: 2
        source_document_page: 21
        explanation: I kept personal details in one form with a brief explanation of their purpose. Field-level
          validation identifies an incorrect entry beside the value that needs attention.
        screens:
          - asset_id: editing-details-with-local-feedback--personal-details
            order: 1
            caption: Personal details
          - asset_id: editing-details-with-local-feedback--name-validation
            order: 2
            caption: Name validation
      - id: using-focused-input-controls
        title: Using focused input controls
        order: 3
        source_document_page: 22
        explanation: I used dedicated pickers for dates and measurements, with unit selection where needed. A
          separate choice dialog includes a way to leave gender undisclosed.
        screens:
          - asset_id: using-focused-input-controls--birthday-picker
            order: 1
            caption: Birthday picker
          - asset_id: using-focused-input-controls--height-and-units
            order: 2
            caption: Height and units
          - asset_id: using-focused-input-controls--gender-choices
            order: 3
            caption: Gender choices
      - id: setting-a-daily-goal
        title: Setting a daily goal
        order: 4
        source_document_page: 23
        explanation: I gave the step goal a focused screen with a large value and adjustment controls. Inline
          validation places the minimum requirement beside the value being edited.
        screens:
          - asset_id: setting-a-daily-goal--daily-step-goal
            order: 1
            caption: Daily step goal
          - asset_id: setting-a-daily-goal--minimum-goal-feedback
            order: 2
            caption: Minimum goal feedback
